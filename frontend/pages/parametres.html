<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Cart — Paramètres</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <main class="page-content">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <!-- Profil Admin -->
        <div class="card">
          <h2 style="font-size:0.98rem;font-weight:700;margin-bottom:20px">Profil Administrateur</h2>
          <div class="form-group">
            <label>Nom Complet</label>
            <input type="text" class="form-control" id="profNom" value="Admin User">
          </div>
          <div class="form-group">
            <label>Adresse Email</label>
            <input type="email" class="form-control" id="profEmail" value="admin@smartcart.tn">
          </div>
          <div class="form-group">
            <label>Rôle</label>
            <input type="text" class="form-control" value="Responsable du Magasin" disabled style="background:#f8fafc">
          </div>
          <button class="btn btn-primary btn-sm" onclick="showToast('Profil mis à jour ✓')">Sauvegarder</button>
        </div>

        <!-- Mot de passe -->
        <div class="card">
          <h2 style="font-size:0.98rem;font-weight:700;margin-bottom:20px">Changer le Mot de Passe</h2>
          <div class="form-group">
            <label>Mot de passe actuel</label>
            <input type="password" class="form-control" placeholder="••••••••">
          </div>
          <div class="form-group">
            <label>Nouveau mot de passe</label>
            <input type="password" class="form-control" placeholder="••••••••">
          </div>
          <div class="form-group">
            <label>Confirmer le nouveau mot de passe</label>
            <input type="password" class="form-control" placeholder="••••••••">
          </div>
          <button class="btn btn-primary btn-sm" onclick="showToast('Mot de passe mis à jour ✓')">Mettre à jour</button>
        </div>

        <!-- Système -->
        <div class="card">
          <h2 style="font-size:0.98rem;font-weight:700;margin-bottom:20px">Paramètres Système</h2>
          <div class="form-group">
            <label>Nom du Supermarché</label>
            <input type="text" class="form-control" value="Smart Cart Supermarket">
          </div>
          <div class="form-group">
            <label>Seuil Batterie Faible (%)</label>
            <input type="number" class="form-control" value="20" min="5" max="50">
          </div>
          <div class="form-group">
            <label>Devise</label>
            <select class="form-control">
              <option selected>TND — Dinar Tunisien</option>
              <option>EUR — Euro</option>
              <option>USD — Dollar</option>
            </select>
          </div>
          <button class="btn btn-primary btn-sm" onclick="showToast('Paramètres sauvegardés ✓')">Sauvegarder</button>
        </div>

        <!-- Notifications -->
        <div class="card">
          <h2 style="font-size:0.98rem;font-weight:700;margin-bottom:20px">Alertes & Notifications</h2>

          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <span style="font-size:0.88rem;font-weight:500">Alertes batterie faible</span>
            <input type="checkbox" checked style="width:18px;height:18px;cursor:pointer">
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <span style="font-size:0.88rem;font-weight:500">Nouvelles sessions</span>
            <input type="checkbox" checked style="width:18px;height:18px;cursor:pointer">
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <span style="font-size:0.88rem;font-weight:500">Paiements complétés</span>
            <input type="checkbox" checked style="width:18px;height:18px;cursor:pointer">
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <span style="font-size:0.88rem;font-weight:500">Alertes maintenance</span>
            <input type="checkbox" checked style="width:18px;height:18px;cursor:pointer">
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <span style="font-size:0.88rem;font-weight:500">Rapport journalier</span>
            <input type="checkbox" checked style="width:18px;height:18px;cursor:pointer">
          </div>
        </div>
      </div>

      <!-- Danger zone -->
      <div class="card" style="margin-top:20px;border-color:#fecaca">
        <h2 style="font-size:0.98rem;font-weight:700;margin-bottom:8px;color:#ef4444">Zone Critique</h2>
        <p style="font-size:0.84rem;color:#64748b;margin-bottom:16px">Ces actions sont irréversibles. Procédez avec prudence.</p>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn btn-sm" style="background:#fef2f2;color:#ef4444;border:1px solid #fecaca" onclick="showToast('Réinitialisation annulée','warning')">Réinitialiser les données de démo</button>
          <button class="btn btn-danger btn-sm" onclick="confirmLogout()">Se Déconnecter</button>
        </div>
      </div>

    </main>
  </div>
</div>
<div id="logout-mount"></div>
<div id="toastContainer" class="toast-container"></div>
<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script>
initLayout('parametres', 'Paramètres');
</script>
</body>
</html>
