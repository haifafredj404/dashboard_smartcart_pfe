<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Cart — Notifications</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-layout">
  <div id="sidebar-mount"></div>

  <div class="main-content">
    <div id="topbar-mount"></div>

    <main class="page-content">

      <div class="card">
        <div class="section-header">
          <h2>Historique des Notifications</h2>

          <button
            class="btn btn-outline btn-sm"
            onclick="markAllRead()">
            Tout marquer comme lu
          </button>
        </div>

        <div id="notifsList">
          <div style="text-align:center;padding:40px">
            <div class="spinner"></div>
          </div>
        </div>

      </div>

    </main>
  </div>
</div>

<div id="logout-mount"></div>
<div id="toastContainer" class="toast-container"></div>

<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>

<script>

initLayout('notifications', 'Notifications');

const iconMap = {

  batterie_faible : {
    icon:'🔋',
    cls:'warning'
  },

  nouvelle_session : {
    icon:'🛒',
    cls:'info'
  },

  alerte_systeme : {
    icon:'⚠️',
    cls:'danger'
  },

  paiement : {
    icon:'✅',
    cls:'info'
  },

  maintenance : {
    icon:'🔧',
    cls:'warning'
  },

  ajout_chariot : {
    icon:'➕',
    cls:'info'
  },

  suppression_chariot : {
    icon:'🗑️',
    cls:'danger'
  }

};

async function loadNotifications() {

  const data = await api.get('/notifications');

  const list =
    document.getElementById('notifsList');

  if (!data || !data.success) {

    list.innerHTML =
      '<div style="text-align:center;padding:40px;color:#94a3b8">' +
      'Erreur de chargement' +
      '</div>';

    return;
  }

  if (data.data.length === 0) {

    list.innerHTML = `
      <div style="text-align:center;padding:48px;color:#94a3b8">
        <div style="font-size:2rem;margin-bottom:12px">🔔</div>
        <div style="font-weight:600">Aucune notification</div>
      </div>
    `;

    return;
  }

  list.innerHTML = data.data.map(n => {

    const cfg =
      iconMap[n.type] ||
      { icon:'🔔', cls:'info' };

    return `

    <div
      id="notif-${n._id}"
      style="
        display:flex;
        align-items:flex-start;
        gap:14px;
        padding:16px;
        border-bottom:1px solid rgba(226,232,240,0.6);
        ${n.lu ? '' : 'background:#f8fafc;'}
      ">

      <div class="notif-item-icon ${cfg.cls}">
        ${cfg.icon}
      </div>

      <div style="flex:1">

        <div style="
          font-size:0.9rem;
          font-weight:${n.lu ? '500' : '700'};
          color:#1e293b;
        ">
          ${n.titre}
        </div>

        <div style="
          font-size:0.82rem;
          color:#64748b;
          margin-top:4px;
        ">
          ${n.message}
        </div>

        <div style="
          font-size:0.75rem;
          color:#94a3b8;
          margin-top:8px;
        ">
          🕐 ${formatRelativeTime(n.createdAt)}
        </div>

        ${!n.lu ? `

        <div style="
          display:flex;
          gap:8px;
          margin-top:10px;
        ">

          <button
            class="btn btn-outline btn-sm"
            onclick="ignoreNotif('${n._id}')">
            Marquer comme lu
          </button>

        </div>

        ` : ''}

      </div>

    </div>

    `;

  }).join('');

}

async function ignoreNotif(id) {

  const res =
    await api.put(
      '/notifications/' + id + '/lire',
      {}
    );

  if (res && res.success) {

    showToast('Notification mise à jour');

    loadNotifications();

    if (typeof loadNotifCount === 'function') {
      loadNotifCount();
    }

  }

}

async function markAllRead() {

  const res =
    await api.put(
      '/notifications/lire-tout',
      {}
    );

  if (res && res.success) {

    showToast(
      'Toutes les notifications marquées comme lues'
    );

    loadNotifications();

    if (typeof loadNotifCount === 'function') {
      loadNotifCount();
    }

  }

}

loadNotifications();

</script>

</body>
</html>
