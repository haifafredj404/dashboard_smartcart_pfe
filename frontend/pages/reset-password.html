<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Cart — Nouveau mot de passe</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🔐</div>
      <h1>Smart Cart</h1>
      <p>Réinitialisation du mot de passe</p>
    </div>

    <div id="formReset">
      <div class="form-group">
        <label>Nouveau mot de passe</label>
        <div style="position:relative">
          <input type="password" class="form-control" id="newPwd" placeholder="••••••••" style="padding-right:42px">
          <button onclick="togglePwd('newPwd',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94a3b8">👁️</button>
        </div>
      </div>
      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <input type="password" class="form-control" id="confirmPwd" placeholder="••••••••">
      </div>
      <div id="resetMsg" style="font-size:0.82rem;margin-bottom:12px;display:none"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px" onclick="doReset()" id="resetBtn">
        Mettre à jour le mot de passe
      </button>
    </div>

  </div>
</div>
<script src="../js/api.js"></script>
<script>
function togglePwd(id, btn) {
  var inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁️'; }
}

var token = new URLSearchParams(window.location.search).get('token');
if (!token) window.location.href = 'login.html';

async function doReset() {
  var pwd1   = document.getElementById('newPwd').value;
  var pwd2   = document.getElementById('confirmPwd').value;
  var msgEl  = document.getElementById('resetMsg');
  var btn    = document.getElementById('resetBtn');

  if (!pwd1 || pwd1.length < 6) {
    msgEl.style.color = '#ef4444';
    msgEl.textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
    msgEl.style.display = 'block'; return;
  }
  if (pwd1 !== pwd2) {
    msgEl.style.color = '#ef4444';
    msgEl.textContent = 'Les mots de passe ne correspondent pas.';
    msgEl.style.display = 'block'; return;
  }

  btn.textContent = 'Mise à jour...';
  btn.disabled    = true;

  var res = await api.post('/auth/reset-password', { token, mot_de_passe: pwd1 });

  btn.textContent = 'Mettre à jour le mot de passe';
  btn.disabled    = false;

  if (res && res.success) {
    msgEl.style.color   = '#10b981';
    msgEl.textContent   = '✅ ' + res.message;
    msgEl.style.display = 'block';
    setTimeout(function() { window.location.href = 'login.html'; }, 2000);
  } else {
    msgEl.style.color   = '#ef4444';
    msgEl.textContent   = '❌ ' + (res ? res.message : 'Lien invalide ou expiré.');
    msgEl.style.display = 'block';
  }
}
</script>
</body>
</html>
